name: CI/CD Pipeline with Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build Docker image
      run: docker build -t secdevops-pipeline .

    - name: Validate CodeQL permissions
      run: echo "CodeQL security-events permission is set to write"

    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scan-ref: 'secdevops-pipeline'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      run: |
        REPO_LC=$(echo "${{ github.repository_owner }}/secdevops-pipeline" | tr '[:upper:]' '[:lower:]')
        docker tag secdevops-pipeline ghcr.io/$REPO_LC:latest
        docker push ghcr.io/$REPO_LC:latest

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.0"

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate

    - name: Build Lambda deployment package
      run: |
        mkdir lambda-package
        cp -r main.py lambda_handler.py lambda-package/
        pip install -r requirements.txt -t lambda-package/
        cd lambda-package
        zip -r ../deployment-package.zip .
        cd ..

    - name: Check AWS credentials availability
      id: check_aws
      run: |
        if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Plan
      if: steps.check_aws.outputs.available == 'true'
      working-directory: ./terraform
      run: terraform plan
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && steps.check_aws.outputs.available == 'true'
      working-directory: ./terraform
      run: terraform apply -auto-approve
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Terraform run status
      env:
        AWS_AVAILABLE: ${{ steps.check_aws.outputs.available }}
        GIT_REF: ${{ github.ref }}
      run: |
        if [[ "$AWS_AVAILABLE" == "true" ]]; then
          echo "✅ Terraform ran: Init, Validate, Plan completed successfully."
          if [[ "$GIT_REF" == "refs/heads/main" ]]; then
            echo "✅ Terraform Apply ran on main branch."
          else
            echo "ℹ️ Terraform Apply skipped (only runs on main branch)."
          fi
        else
          echo "✅ Terraform ran: Init and Validate completed successfully."
          echo "⚠️ Terraform Plan and Apply skipped: AWS credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) are not configured."
        fi
      